version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adt-se-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - ./workspace:/app/workspace
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adt-se-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

